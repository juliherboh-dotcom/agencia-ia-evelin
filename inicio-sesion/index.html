<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Nexo.IA</title>
  <meta name="description" content="Inicia sesión en Nexo.IA con tu correo y contraseña, o con tu cuenta de Google.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B2A4A'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='34' font-weight='800' fill='white'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>

  <div class="wordmark">
    <a href="/" style="display:flex; align-items:center; gap:0.45rem 0.6rem; text-decoration:none; color:inherit;">
      <svg class="wordmark__isotipo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <rect width="48" height="48" rx="10" fill="var(--color-texto-fuerte)"></rect>
        <path d="M14 32V16h5l10 12V16h5v16h-5L19 20v12h-5Z" fill="var(--color-blanco)"></path>
        <circle cx="36" cy="14" r="4" fill="var(--color-acento)"></circle>
      </svg>
      <span class="wordmark__marca">Nexo.IA</span>
    </a>
    <div class="wordmark__auth" data-auth-nav></div>
  </div>

  <main class="auth-pagina">
    <div class="auth-tarjeta">
      <div class="auth-tarjeta__eyebrow">Bienvenida de vuelta</div>
      <h1 class="auth-tarjeta__titulo">Iniciar sesión</h1>
      <p class="auth-tarjeta__subtitulo">Entra con tu correo y contraseña, o con tu cuenta de Google.</p>

      <div id="mensaje" class="auth-mensaje" role="alert"></div>

      <form id="form-login" class="auth-form" novalidate>
        <div class="auth-campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="auth-campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" minlength="6" required>
        </div>
        <button type="submit" id="btn-login" class="auth-boton auth-boton--primario">Iniciar sesión</button>
      </form>

      <div class="auth-divisor">o</div>

      <button type="button" id="btn-google" class="auth-boton auth-boton--google">
        <i class="ti ti-brand-google" aria-hidden="true"></i>
        Continuar con Google
      </button>

      <p class="auth-tarjeta__pie">¿No tienes cuenta? <a href="/registrarse">Regístrate</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/auth.js"></script>
  <script>
    const mensaje = document.getElementById("mensaje");
    const formLogin = document.getElementById("form-login");
    const btnLogin = document.getElementById("btn-login");
    const btnGoogle = document.getElementById("btn-google");

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "auth-mensaje auth-mensaje--visible auth-mensaje--" + tipo;
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get("registrado") === "1") {
      mostrarMensaje("Cuenta creada. Ya puedes iniciar sesión.", "ok");
    }

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const client = window.NexoAuth.getClient();
      if (!client) {
        mostrarMensaje("No se pudo conectar con el servicio de autenticación.", "error");
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "Iniciando sesión…";

      const { error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });

      if (error) {
        mostrarMensaje(window.NexoAuth.mensajeError(error), "error");
        btnLogin.disabled = false;
        btnLogin.textContent = "Iniciar sesión";
        return;
      }

      window.location.href = "/";
    });

    btnGoogle.addEventListener("click", () => {
      window.NexoAuth.iniciarSesionConGoogle();
    });
  </script>
</body>
</html>
